[project]
name = "legallens-backend"
version = "0.1.0"
description = "Legal Lens backend — FastAPI. Grounded reading and drafting over an attorney's own documents."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.118",
    "uvicorn[standard]>=0.37",
    "pydantic>=2.11",
    "pydantic-settings>=2.11",
    "sqlalchemy[asyncio]>=2.0.43",
    "aiosqlite>=0.21",
    "alembic>=1.16",
    "argon2-cffi>=25.1",
    "cryptography>=46.0",
    "python-multipart>=0.0.20",
    "pypdf>=6.1",
    "python-docx>=1.2",
    "itsdangerous>=2.2",
    "email-validator>=2.3",
]

[project.optional-dependencies]
# The M4 AI layer. Kept out of the base dependencies on purpose: the backend
# runs the fixture engine and must stay installable and startable without a
# model provider or an API key. `langchain-anthropic` wraps the official
# `anthropic` SDK, which is the only path to the model.
ai = [
    "langchain-core>=1.6.7",
    "langchain-anthropic>=1.7.5",
    "anthropic>=1.12.0",
    # Hybrid retrieval. Qdrant runs embedded from a local path in dev and as a
    # server at M6 — same client either way.
    "qdrant-client>=1.19",
    # bge-m3 (dense + learned sparse) and bge-reranker-v2-m3. Pulls torch, so
    # it is deliberately outside the base dependencies: the backend must stay
    # installable and startable without a model stack.
    "FlagEmbedding>=1.4.2",
    # Direct only so the CPU index below applies — uv sources ignore
    # transitive dependencies.
    "torch",
]
# Retrieval: embeddings and the vector store. Also the ingestion write path —
# `app/indexing.py` embeds with bge-m3 and upserts into Qdrant, so a checkout
# without this extra parses documents and stores pages and spans but indexes no
# vectors. `LL_INDEXER=auto` detects that and says so on the document rather
# than failing the upload.
#
# `FlagEmbedding` pulls torch, which is most of the ~2.5 GB. That is the reason
# this is an extra and not a dependency: `uv sync` with no extras must still
# produce a backend that starts.
retrieval = [
    "qdrant-client>=1.12",
    "FlagEmbedding>=1.3",
    "torch",
]

# OCR for scanned PDFs. `pypdfium2` rasterises (Apache-2.0/BSD, no system
# package — PyMuPDF is faster and AGPL, which a product billing attorneys
# cannot ship); `pytesseract` wraps the tesseract binary, which is a **system**
# package this cannot install (macOS: brew install tesseract).
ocr = [
    "pypdfium2>=4.30",
    "pillow>=11.0",
    "pytesseract>=0.3.13",
]

# The OCR path with no system binary at all: PP-OCRv4 as ONNX models inside the
# wheel, ~15 MB, Apache-2.0. Coarser confidence than tesseract — per detected
# box rather than per word — so `LL_OCR_CONFIDENCE_FLOOR` should be re-checked
# when switching. See `app/ingestion/ocr/rapid.py`.
ocr-onnx = [
    "pypdfium2>=4.30",
    "pillow>=11.0",
    "rapidocr-onnxruntime>=1.4",
]
dev = [
    "pytest>=8.4",
    "pytest-asyncio>=1.2",
    "httpx>=0.28",
    "ruff>=0.14",
    "mypy>=1.18",
    # tests/test_intent_router.py runs offline against a fake chat model, but
    # still imports the LangChain types it fakes.
    "langchain-core>=1.6.7",
    "langchain-anthropic>=1.7.5",
    # The ingestion tests inject fake embedders and a fake store, so they need
    # neither torch nor a Qdrant binary — but `tests/test_ingestion_ocr.py`
    # renders a real fixture PDF, which needs the rasteriser. Deliberately only
    # pypdfium2 and pillow: the OCR engines themselves are probed for and
    # skipped when absent, so the suite stays runnable without them.
    "pypdfium2>=4.30",
    "pillow>=11.0",
]

# CPU-only torch on Linux. The PyPI wheel pulls ~4 GB of CUDA libraries that
# the Docker image (no GPU) never uses. macOS keeps the PyPI wheel (MPS).
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S", "C4", "RET", "SIM"]
ignore = ["S101", "B008", "RET504"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "E501"]
"app/ai/fixtures/*" = ["E501"]
"migrations/*" = ["E501", "I001"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
warn_return_any = false
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
module = [
    "pypdf.*",
    "docx.*",
    "argon2.*",
    "langchain_anthropic.*",
    "langchain_core.*",
    "FlagEmbedding.*",
    "qdrant_client.*",
    "pypdfium2.*",
    "pytesseract.*",
    "rapidocr_onnxruntime.*",
    "PIL.*",
    "numpy.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
